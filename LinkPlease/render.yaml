services:
  - type: web
    name: linkplease-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PSEUDOGRAM_API_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./linkplease.db
      - key: WEBHOOK_SIGNATURE_REQUIRED
        value: "false"
      - key: MAX_DM_ATTEMPTS
        value: "5"
      - key: LOG_LEVEL
        value: INFO
